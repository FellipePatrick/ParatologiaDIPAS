<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIC - Zoonoses</title>
    <link rel="icon" href="imgs/logo.png" type="image/x-icon">
    <link rel="icon" th:href="@{./../imgs/login/logo.png}" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link th:href="@{../../css/login/style.css}" rel="stylesheet" type="text/css">
</head>

<body>

    <div class="container-fluid px-1 px-md-5 px-lg-1 px-xl-5 py-5 mx-auto">
        <div th:fragment="warnings">
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        </div>

        <div class="card card0 border-0">
            <div class="row d-flex">
                <div class="col-lg-6 right" th:fragment="headerimg">
                    <div class="card1 pb-5 py-1" th:fragment="headerimg">
                        <div class="row px-3 justify-content-center mt-4 mb-1 border-line">
                            <img class="px-5" th:src="@{./../imgs/login/imgLogin.jpg}" type="image/jpg">
                        </div>
                    </div>
                </div>
                <div class="col-lg-6 py-3">
                    <div class="card2 card border-0 px-4 py-5">
                        <div class="row mb-4 px-3 d-flex justify-content-center" th:fragment="headerINF">
                            <h6 class="mb-0 mr-4 mt-2 d-flex justify-content-center mb-3">Entre no</h6>
                            <div class="linkedin text-center mr-3 mx-1 efeito">S</div>
                            <div class="twitter text-center mr-3 mx-1 efeito">I</div>
                            <div class="linkedin text-center mr-3 mx-1 efeito">C</div>
                        </div>
                        <div class="row px-3 mb-4 " th:fragment="headerLines">
                            <div class="line"></div>
                            <div class="line"></div>
                        </div>
                        <form th:action="@{/login}" method="post">
                            <div class="row px-3">
                                <div class="offset-md-2 col-md-8" style="text-align: center;" >
                                    <label class="mb-1" >
                                        <h6 class="mb-0 text-sm">Matrícula ou Email</h6>
                                    </label>
                                    <input class="mb-4 my-2" type="text" name="matricula" placeholder="Matrícula ou Email" required>
                                </div>
                            </div>
                            <div class="row px-3">
                                <div class="offset-md-2 col-md-8" style="text-align: center;" >
                                    <label class="mb-1">
                                        <h6 class="mb-0 text-sm">Senha</h6>
                                    </label>
                                    <input type="password" class="my-2" name="senha"  placeholder="Senha" required>
                                </div>
                            </div>
                            <div class="row px-3 mb-4">
                                <div class="d-flex justify-content-center py-3">
                                    <div class="custom-control custom-checkbox">
                                        <input id="chk1" type="checkbox" name="lembrar" class="">
                                    </div>
                                    <label for="chk1" class="custom-control-label text-sm mx-2">Lembre-se de mim</label>
                                </div>
                                <a href="#" class="d-flex justify-content-center ml-auto mb-0 text-sm mx-2"
                                    data-bs-toggle="modal" data-bs-target="#esqueciSenhaModal">Esqueceu a senha?</a>
                            </div>
                            <div class="row mb-3 px-3 py-3 d-flex justify-content-center">
                                <button type="submit" class="btn btn-blue text-center">Entrar</button>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
            <div class="bg-blue py-4" th:fragment="footer">
                <div class="row px-3 justify-content-between align-items-center">
                    <small class="ml-4 ml-sm-5 mb-2 text-white">
                        Copyright &copy; <span id="currentYear"></span>. All rights reserved for Fellipe Patrick.
                    </small>
                </div>
        </div>
    </div>

    <div class="modal fade" id="esqueciSenhaModal" tabindex="-1" aria-labelledby="esqueciSenhaLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <div class="modal-header bg-primary text-white rounded-top-4">
                    <h5 class="modal-title" id="esqueciSenhaLabel">Recuperação de Senha</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Fechar"></button>
                </div>
                <div class="modal-body text-center">
                    <p class="mb-0">Entre em contato com seu <strong>gestor</strong> ou <strong>administrador do
                            sistema</strong> para recuperar sua senha.</p>
                </div>
                <div class="modal-footer justify-content-center">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.getElementById('currentYear').textContent = new Date().getFullYear();
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
