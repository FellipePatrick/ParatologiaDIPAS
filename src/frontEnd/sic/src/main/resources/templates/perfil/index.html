<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/commons :: head}"></head>
<body id="page-top">
    <div id="wrapper">
        <div th:replace="~{fragments/commons :: sidebar}"></div>
        <div id="content-wrapper" class="d-flex flex-column">
            <div id="content">
                <nav th:replace="~{fragments/commons :: nav}"></nav>
                <div class="container-fluid">
                    <div th:replace="~{fragments/commons :: headerMain(name='Perfil do Usuário')}"></div>
                    
                    <div class="card card-waves mb-4 mt-5">
                        <div th:replace="~{fragments/commons :: warnings}"></div>
                        <div class="card-header bg-primary text-center">
                            <h4 class="text-white">Informações do Usuário</h4>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-4 text-center my-5">
                                    <img th:src="@{../../imgs/home/capa.jpg}" style="border-radius:5px ;"  alt="Imagem do perfil" class="img " width="300">
                                    <button class="btn btn-primary btn-sm my-4" style="pointer-events: none;">
                                        SIC - Zoonoses
                                    </button>                                      
                                </div>
                                <div class="col-md-8">
                                    <form>
                                        <div class="form-group">
                                            <label for="nome">Nome</label>
                                            <input type="text" class="form-control" id="nome" th:value="${nome}" readonly>
                                        </div>
                                        <div class="form-group">
                                            <label for="email">Email</label>
                                            <input type="email" class="form-control" id="email" th:value="${email}" readonly>
                                        </div>
                                        <div class="form-group">
                                            <label for="telefone">Telefone</label>
                                            <input type="text" class="form-control" id="telefone" th:value="${session.telefone}" readonly>
                                        </div>
                                        <div class="form-group">
                                            <label for="matricula">Matricula</label>
                                            <input type="text" class="form-control" id="matricula" th:value="${matricula}" readonly>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card mt-5">
                        <div class="card-header ">
                            <h4 cl>Configurações da Conta</h4>
                        </div>
                        <div class="card-body">
                            <form method="post" th:action="@{/password}">
                            <div class="form-group">
                                <label for="alterarSenha">Alterar Senha</label>
                                <input type="password" class="form-control" id="alterarSenha" name="novaSenha" placeholder="Digite sua nova senha">
                            </div>
                            <div class="form-group">
                                <label for="confirmarSenha">Confirmar Senha</label>
                                <input type="password" class="form-control" id="confirmarSenha" name="confirmarSenha" placeholder="Confirme sua nova senha">
                            </div>
                            <button type="submit" class="btn btn-primary">Salvar Alterações</button>
                        </form>
                        </div>
                    </div>
                </div>            
            </div>
            <footer th:replace="~{fragments/commons :: footer}" class="bg-white text-dark py-4"></footer>
        </div>
    </div>
    <script>
        const telefoneInput = document.getElementById("telefone");
    
        let telefone = telefoneInput.value || ""; 
        console.log("Telefone antes do tratamento:", telefone);
    
        if (!telefone || telefone.trim() === "" || telefone.length < 10) {
            telefone = "00000000000";
        }
    
        telefone = telefone.replace(/\D/g, "");
    
        let telefoneFormatado = telefone;
    
        if (telefone.length === 11) {
            telefoneFormatado = telefone.replace(/(\d{2})(\d{5})(\d{4})/, "($1) $2-$3");
        } else if (telefone.length === 10) {
            telefoneFormatado = telefone.replace(/(\d{2})(\d{4})(\d{4})/, "($1) $2-$3");
        }
    
        telefoneInput.value = telefoneFormatado;
    </script>
</body>
</html>
