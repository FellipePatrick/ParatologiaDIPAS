<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/commons :: head}"></head>
<body id="page-top">
    <div id="wrapper">
        
       <div th:replace="~{fragments/commons :: sidebar}"></div>
        <div id="content-wrapper" class="d-flex flex-column">
            <div id="content">
                <nav th:replace="~{fragments/commons :: nav}"></nav>
                <div class="container-fluid">               
                    <div th:replace="~{fragments/commons :: headerMain (name='Relatorios')}"></div>
                    <div th:replace="~{fragments/commons :: warnings}"></div>
                    <div class="card shadow-sm border-0 rounded-lg mb-4 mt-5">
                        <div class="card-header bg-primary text-center">
                            <h5 class="text-white">Vínculos</h5>
                        </div>
                        <div class="card-body">
                            <table class="table table-bordered ">
                                <thead class="thead-dark">
                                    <tr>
                                        <th>ID</th>
                                        <th>Titulo</th>
                                        <th>Dono</th>
                                        <th>Status</th>
                                        <th>Data</th>
                                        <th>Ações</th>
                                    </tr>
                                </thead>
                                <tbody th:if="${#lists.isEmpty(relatorios)}">
                                    <tr>
                                        <td colspan="6" class="text-center">Nenhum relatorio encontrado</td>
                                    </tr>
                                </tbody>
                                <tbody th:unless="${#lists.isEmpty(relatorios)}">
                                    <tr th:each="relatorio, iter : ${relatorios}">
                                        <td th:text="${iter.index + 1}"></td>
                                        <td th:text="${relatorio.titulo}"></td>
                                        <td th:text="${relatorio.dono}"></td>
                                        <td th:text="${relatorio.status}"></td>
                                        <td th:text="${relatorio.data}"></td>
                                        <td>
                                            <a class="btn btn-sm btn-info" th:href="@{'/relatorios/' + ${relatorio.id}}">Visualizar</a>
                                            <a class="btn btn-sm btn-danger"  th:href="@{'/relatorios/delete/' + ${relatorio.id}}">Fechar</a>
                                        </td>
                                    </tr>
                                </tbody>
                                
                            </table>
                        </div>
                    </div>
                    <div class="card-waves">
                     
                    <div class="card-waves  mt-2">
                        <div class="p-5">
                            <div class="row gx-4 align-items-center justify-content-between">
                                <div class="row">
                                    <div class="col-xl-3 col-md-6 mb-4">
                                        <div class="card border-left-primary shadow h-100 py-2">
                                            <div class="card-body">
                                                <div class="row no-gutters align-items-center">
                                                    <div class="col mr-2">
                                                        <div class="text-xs font-weight-bold text-primary text-uppercase mb-1">
                                                            Relatórios totais</div>
                                                        <div class="h5 mb-0 font-weight-bold text-gray-800" th:text="${totais}"></div>
                                                    </div>
                                                    <div class="col-auto">
                                                        <i class="fas fa-calendar fa-2x text-gray-300"></i>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-xl-3 col-md-6 mb-4">
                                        <div class="card border-left-warning shadow h-100 py-2">
                                            <div class="card-body">
                                                <div class="row no-gutters align-items-center">
                                                    <div class="col mr-2">
                                                        <div class="text-xs font-weight-bold text-warning text-uppercase mb-1">
                                                            Andamento | Rascunho</div>
                                                        <div class="h5 mb-0 font-weight-bold text-gray-800" th:text="${andamento}"></div>
                                                    </div>
                                                    <div class="col-auto">
                                                        <i class="fa fa-folder fa-2x text-gray-300"></i>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-xl-3 col-md-6 mb-4">
                                        <div class="card border-left-info shadow h-100 py-2">
                                            <div class="card-body">
                                                <div class="row no-gutters align-items-center">
                                                    <div class="col mr-2">
                                                        <div class="text-xs font-weight-bold text-info text-uppercase mb-1">Relatórios Em Avaliação
                                                        </div>
                                                        <div class="row no-gutters align-items-center">
                                                            <div class="col-auto">
                                                                <div class="h5 mb-0 mr-3 font-weight-bold text-gray-800 mx-3" th:text="${avaliandos}"></div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div class="col-auto">
                                                        <i class="fas fa-clipboard-list fa-2x text-gray-300"></i>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-xl-3 col-md-6 mb-4">
                                        <div class="card border-left-success shadow h-100 py-2">
                                            <div class="card-body">
                                                <div class="row no-gutters align-items-center">
                                                    <div class="col mr-2">
                                                        <div class="text-xs font-weight-bold text-success text-uppercase mb-1">
                                                            Relatórios Concluídos</div>
                                                        <div class="h5 mb-0 font-weight-bold text-gray-800" th:text="${finalizados}"></div>
                                                    </div>
                                                    <div class="col-auto">
                                                        <i class="fas fa-check fa-2x text-gray-300"></i>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card-waves">
                        <div class="p-3">
                            <h5 class="text-gray-800 mb-4" th:unless="${#lists.isEmpty(relatorios)}">Documentos Recentes</h5>
                            <div class="row gx-4">
                                <div class="col-md-4 mb-4" th:each="relatorio : ${relatorios}">
                                    <a class="card shadow-sm h-100" style="text-decoration: none;" th:href="@{'/relatorios/' + ${relatorio.id}}">
                                        <div class="card-body ">
                                            <h6 class="card-title text-primary font-weight-bold" th:text="${relatorio.titulo}">T</h6>
                                            
                                            <p class="text-muted small">
                                               Descrição: <span th:text="${relatorio.descricao}"></span>
                                            </p>
                                            
                                            <div class="mt-auto">
                                                <p class="text-muted small">
                                                    Gestor: <span th:text="${relatorio.dono}"></span>
                                                </p>
                                                
                                                <p class="text-muted small">
                                                    Data de Acesso: <span th:text="${relatorio.data}"></span>
                                                </p>
                                            </div>
                                        </div>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                </div>            
            </div>
            <footer th:replace="~{fragments/commons :: footer}" class="bg-white text-dark py-4">
            </footer>
        </div>
    </div>
</body>
</html>
