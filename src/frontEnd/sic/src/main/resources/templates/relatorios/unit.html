<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/commons :: head}"></head>
<body id="page-top">
    <div id="wrapper">
        <div th:replace="~{fragments/commons :: sidebar}"></div>
        <div id="content-wrapper" class="d-flex flex-column">
            <div id="content">
                <nav th:replace="~{fragments/commons :: nav}"></nav>
                <div class="container-fluid">
                    <div th:replace="~{fragments/commons :: headerMain (name='Editar Relatorio')}"></div>
                    
                    <div class="card card-waves mb-4 mt-5">
                        <div class="card-body">
                        <h5 class="card-title">Informações do Relatório</h5>
                        <form th:action="@{/relatorio}" method="post" enctype="multipart/form-data">
                                <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}"/>
                                <input type="hidden" name="id" id="id" th:value="${relatorio.id}">
                                <div class="form-group">
                                    <label for="titulo">Título do Relatorio</label>
                                    <input type="text" class="form-control" id="titulo" name="titulo" placeholder="Digite o título" th:value="${relatorio.titulo}" required>
                                </div>
                                <div class="form-group mt-3">
                                    <label for="descricao">Descrição</label>
                                    <textarea class="form-control" id="descricao" name="descricao" rows="3" placeholder="Digite a descrição" th:text="${relatorio.descricao}"  required></textarea>
                                </div>
                              <div class="form-group mt-3">
                            <label for="diagnostico">Diagnóstico</label>
                            <textarea class="form-control" id="diagnostico" name="diagnostico" rows="3" th:text="${relatorio.diagnostico}" readonly></textarea>
                        </div>

                        </div>
                    </div>
                    <div class="card card-waves mt-5">
                        <div class="card-body">
                            <h5 class="card-title">Imagens</h5>
                            <div id="parasitas-gallery" class="row my-4">
                                <!-- Exibindo imagens originais -->
                                <div class="col-md-6 mb-4" th:each="imagem : ${imagensOriginal}">
                                    <div class="card">
                                        <img th:src="${baseImageUrl} + ${imagem.path}"
                                            style="height: 300px; width: 250px;"
                                            class="card-img-top img-thumbnail-small" alt="Imagem Original"
                                            data-bs-toggle="modal" data-bs-target="#imageModal"
                                            th:data-image-src="${baseImageUrl} + ${imagem.path}">
                                        <div class="card-body">
                                            <h6 class="card-title" th:text="${imagem.nome}"></h6>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6 mb-4" th:each="imagem : ${imagensProcessada}">
                                    <div class="card">
                                        <img th:src="${baseImageUrl} + ${imagem.path}"
                                            style="height: 300px; width: 250px;"
                                            class="card-img-top img-thumbnail-small" alt="Imagem Processada"
                                            data-bs-toggle="modal" data-bs-target="#imageModal"
                                            th:data-image-src="${baseImageUrl} + ${imagem.path}">
                                        <div class="card-body">
                                            <h6 class="card-title" th:text="${imagem.nome}"></h6>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>


                     <div class="card card-waves mt-5">
                        <div class="card-body">
                            <h5 class="card-title">Parasitas Identificados</h5>
                            <div id="parasitas-gallery" class="row my-4">
                                <!-- Exibindo imagens originais -->
                                <div class="col-6 col-sm-4 col-md-3 col-lg-2 mb-4" th:each="imagem : ${imagensParasitas}">                                   
                                        <img th:src="${baseImageUrl} + ${imagem.path}"
                                            style="height: 150px; width: 100px;"
                                            class="card-img-top img-thumbnail-small" alt="Imagem Original"
                                            data-bs-toggle="modal" data-bs-target="#imageModal"
                                            th:data-image-src="${baseImageUrl} + ${imagem.path}">
                                        <div class="card-body">
                                            <h6 class="card-title" th:text="${imagem.nome}"></h6>
                                        </div>
                              
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary mt-3">Salvar Relatório</button>
                    
                        <div class="dropdown mt-3">
                            <button class="btn btn-warning dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                                <span th:text="${relatorio.status}">Status</span>
                            </button>
                            <ul class="dropdown-menu" >
                                <li><a class="dropdown-item" href="#" th:onclick="'setStatusValue(`PENDENTE`)'">PENDENTE</a></li>
                                <li><a class="dropdown-item" href="#" th:onclick="'setStatusValue(`AVALIANDO`)'">AVALIANDO</a></li>
                                <li><a class="dropdown-item" href="#" th:onclick="'setStatusValue(`FINALIZADO`)'">FINALIZADO</a></li>
                                <li><a class="dropdown-item" href="#" th:onclick="'setStatusValue(`REJEITADO`)'">REJEITADO</a></li>
                            </ul>
                        </div>
                        <input type="hidden" name="status" id="statusInput" th:value="${relatorio.status}">
                        
                        <div class="mt-3 btn btn-danger">
                            <a  th:href="@{'/relatorios/delete/' + ${relatorio.id}}" style="color: white; text-decoration: none;">Fechar</a>
                        </div>
                    </div>
                </form>
                </div>            
            </div>
            
            <div class="modal fade" id="imageModal" tabindex="-1" aria-labelledby="imageModalLabel" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="imageModalLabel">Imagem</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <img id="modalImage" class="img-fluid" alt="Imagem no Modal">
                        </div>
                    </div>
                </div>
            </div>

            <script>
                   function setStatusValue(value) {
                    document.getElementById('statusInput').value = value;
                    document.querySelector('.btn-warning span').textContent = value; 
                }
                document.addEventListener('DOMContentLoaded', function () {
                    var modalImage = document.getElementById('modalImage');
                    var imageElements = document.querySelectorAll('[data-bs-target="#imageModal"]');

                    imageElements.forEach(function (imageElement) {
                        imageElement.addEventListener('click', function () {
                            var imageSrc = imageElement.getAttribute('data-image-src');
                            modalImage.src = imageSrc;
                        });
                    });
                });
            </script>
            <footer th:replace="~{fragments/commons :: footer}" class="bg-white text-dark py-4"></footer>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

</body>
</html>
